name: Build FOS on test-kheap

on:
  push:
    branches:
      - test-kheap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 32-bit FOS kernel image
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib binutils perl

      - name: Provide expected i386-elf tool names
        run: |
          for tool in gcc as ar ld objcopy objdump nm; do
            sudo ln -sf "$(command -v "$tool")" "/usr/local/bin/i386-elf-$tool"
          done
          i386-elf-gcc --version
          i386-elf-ld --version

      - name: Build kernel disk image
        run: make -C FOS_PROJECT_2026_TEMPLATE clean all V=1

      - name: Check generated image
        run: test -s FOS_PROJECT_2026_TEMPLATE/obj/kern/bochs.img

      - name: Save kernel image
        uses: actions/upload-artifact@v4
        with:
          name: fos-kernel-image
          path: FOS_PROJECT_2026_TEMPLATE/obj/kern/bochs.img